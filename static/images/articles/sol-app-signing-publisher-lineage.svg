    <circle cx="121" cy="75" r="7" fill="#cceeff"/><path d="M128 75h20M141 75v9" stroke="#cceeff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="202" cy="75" r="8" fill="#ffd17a"/><path d="M210 75h22M224 75v10" stroke="#ffd17a" stroke-width="4" stroke-linecap="round"/>
    <text x="48" y="130" fill="#a7cadc" font-size="14" text-anchor="middle">KEY A</text><text x="130" y="130" fill="#a7cadc" font-size="14" text-anchor="middle">KEY B</text><text x="212" y="130" fill="#ffca70" font-size="14" font-weight="700" text-anchor="middle">KEY C</text>
    <text x="130" y="174" fill="#f6fbff" font-size="21" font-weight="720" text-anchor="middle">PUBLISHER LINEAGE</text><text x="130" y="199" fill="#9fc4d8" font-size="13" text-anchor="middle">Root → current signer</text>
