<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SOL Compositor Protocol security architecture</title>
  <desc id="desc">An authenticated application passes a scoped capability token through SCP to create a protected surface in the SOL compositor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".58" stop-color="#0b2037"/>
      <stop offset="1" stop-color="#102b45"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a0"/>
      <stop offset=".5" stop-color="#ffbd59"/>
      <stop offset="1" stop-color="#f47b35"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9ddf6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5d9ac7" stop-opacity=".06"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#ffbd59"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1068" cy="82" r="250" fill="#2873a2" opacity=".12"/>
  <circle cx="104" cy="674" r="300" fill="#174a72" opacity=".16"/>

  <g opacity=".14" stroke="#93cce7" stroke-width="1">
    <path d="M0 115h1200M0 215h1200M0 315h1200M0 415h1200M0 515h1200M0 615h1200"/>
    <path d="M100 0v675M250 0v675M400 0v675M550 0v675M700 0v675M850 0v675M1000 0v675M1150 0v675"/>
  </g>

  <g transform="translate(78 66)">
    <circle cx="42" cy="42" r="30" fill="#ffb74f" opacity=".25" filter="url(#glow)"/>
    <circle cx="42" cy="42" r="24" fill="url(#sun)"/>
    <path d="M42 7V0M42 84v-7M7 42H0M84 42h-7M17 17l-5-5M72 72l-5-5M67 17l5-5M17 67l-5 5" stroke="#ffd27c" stroke-width="4" stroke-linecap="round"/>
    <text x="88" y="39" fill="#f8fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="760" letter-spacing="5">SOL</text>
    <text x="89" y="67" fill="#9fc4dc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="2.5">COMPOSITOR PROTOCOL</text>
  </g>

  <text x="600" y="184" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="74" font-weight="780" text-anchor="middle" letter-spacing="14">SCP</text>
  <text x="600" y="221" fill="#b8d8e9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="3.5">IDENTITY · CAPABILITY · CONTEXT</text>

  <g transform="translate(76 286)">
    <rect width="274" height="190" rx="22" fill="url(#card)" stroke="#9fd4ed" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="137" cy="60" r="27" fill="#8bc7e7" opacity=".22"/>
    <circle cx="137" cy="53" r="10" fill="#cceafb"/>
    <path d="M116 83c4-15 38-15 42 0" fill="none" stroke="#cceafb" stroke-width="8" stroke-linecap="round"/>
    <text x="137" y="126" fill="#f6fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">AUTHENTICATED APP</text>
    <text x="137" y="156" fill="#98bdd3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle">PID → AppId</text>
  </g>

  <g transform="translate(463 286)">
    <rect width="274" height="190" rx="22" fill="url(#card)" stroke="#ffbd59" stroke-opacity=".72" stroke-width="2"/>
    <path d="M104 51h67a12 12 0 0 1 12 12v33a12 12 0 0 1-12 12h-67a12 12 0 0 1-12-12V63a12 12 0 0 1 12-12z" fill="#ffbd59" opacity=".18"/>
    <circle cx="115" cy="80" r="8" fill="#ffcc74"/>
    <path d="M123 80h44M157 80v12M145 80v9" stroke="#ffcc74" stroke-width="5" stroke-linecap="round"/>
    <text x="137" y="126" fill="#f6fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">SCOPED TOKEN</text>
    <text x="137" y="156" fill="#d9b46c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle">App · Session · Capability</text>
  </g>

  <g transform="translate(850 286)">
    <rect width="274" height="190" rx="22" fill="url(#card)" stroke="#9fd4ed" stroke-opacity=".55" stroke-width="2"/>
    <rect x="81" y="43" width="112" height="72" rx="9" fill="#8bc7e7" opacity=".18" stroke="#cceafb" stroke-width="3"/>
    <path d="M82 68h110" stroke="#cceafb" stroke-width="3"/>
    <circle cx="95" cy="56" r="3" fill="#ffbd59"/>
    <circle cx="106" cy="56" r="3" fill="#ffbd59" opacity=".72"/>
    <text x="137" y="141" fill="#f6fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">TRUSTED SURFACE</text>
    <text x="137" y="169" fill="#98bdd3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle">Compositor-owned chrome</text>
  </g>

  <path d="M367 381h77" stroke="#ffbd59" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M754 381h77" stroke="#ffbd59" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(247 541)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="706" height="70" rx="18" fill="#07131f" fill-opacity=".72" stroke="#6ea8ca" stroke-opacity=".38"/>
    <text x="353" y="31" fill="#ffffff" font-size="18" font-weight="650" text-anchor="middle" letter-spacing="1.2">A VERIFIABLE AUTHORITY CONTRACT</text>
    <text x="353" y="53" fill="#ffbd59" font-size="13" font-weight="620" text-anchor="middle" letter-spacing="2.4">NOT JUST A PIXEL TRANSPORT</text>
  </g>
</svg>
