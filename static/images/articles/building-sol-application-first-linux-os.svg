<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SOL operating system architecture</title>
  <desc id="desc">A luminous SOL core above layered Linux kernel, system services, Wayland, runtime, and application surfaces.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10253d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.52" stop-color="#ffbd59"/>
      <stop offset="1" stop-color="#f47b35"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bdcff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#68a7d8" stop-opacity=".08"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1038" cy="112" r="238" fill="#27668f" opacity=".12"/>
  <circle cx="116" cy="632" r="280" fill="#173e67" opacity=".22"/>

  <g opacity=".18" stroke="#8acced" stroke-width="1">
    <path d="M0 118h1200M0 216h1200M0 314h1200M0 412h1200M0 510h1200"/>
    <path d="M152 0v675M340 0v675M528 0v675M716 0v675M904 0v675M1092 0v675"/>
  </g>

  <g transform="translate(105 82)">
    <circle cx="92" cy="92" r="58" fill="#ffb74f" opacity=".28" filter="url(#glow)"/>
    <circle cx="92" cy="92" r="43" fill="url(#sun)"/>
    <path d="M92 18v-14M92 180v-14M18 92H4M180 92h-14M40 40 29 29M155 155l-10-10M144 40l11-11M39 145l-10 10" stroke="#ffd27c" stroke-width="6" stroke-linecap="round"/>
    <text x="178" y="84" fill="#f8fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="750" letter-spacing="10">SOL</text>
    <text x="181" y="120" fill="#9fc4dc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="4">APPLICATION-FIRST OS</text>
  </g>

  <g transform="translate(382 224)">
    <g fill="url(#glass)" stroke="#a8d7ef" stroke-opacity=".5" stroke-width="2">
      <rect x="0" y="0" width="700" height="82" rx="16"/>
      <rect x="32" y="102" width="636" height="82" rx="16"/>
      <rect x="64" y="204" width="572" height="82" rx="16"/>
      <rect x="96" y="306" width="508" height="82" rx="16"/>
    </g>
    <g fill="#f5fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650" letter-spacing="1.5">
      <text x="28" y="50">SOLKIT · .APP APPLICATIONS</text>
      <text x="60" y="152">WAYLAND COMPOSITOR · SHELL · RUNTIME</text>
      <text x="92" y="254">SECURITY · ACCOUNTS · SERVICES</text>
      <text x="124" y="356">LINUX KERNEL · DRIVERS · IMAGE</text>
    </g>
    <g fill="#ffbd59">
      <circle cx="655" cy="41" r="7"/>
      <circle cx="623" cy="143" r="7"/>
      <circle cx="591" cy="245" r="7"/>
      <circle cx="559" cy="347" r="7"/>
    </g>
  </g>

  <text x="108" y="646" fill="#d8e9f4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="560">REUSE LINUX.</text>
  <text x="284" y="646" fill="#ffbd59" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="720">OWN THE OPERATING-SYSTEM CONTRACT.</text>
</svg>
