<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SOL minimum-authority permission system</title>
  <desc id="desc">An authenticated application's typed request is narrowed by identity, capability, resource, and duration into a revocable scoped handle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#112c45"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe49b"/><stop offset=".52" stop-color="#ffbd59"/><stop offset="1" stop-color="#ef7938"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9def6" stop-opacity=".22"/><stop offset="1" stop-color="#5f9cc8" stop-opacity=".06"/></linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#ffbd59"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><circle cx="1078" cy="95" r="250" fill="#276c98" opacity=".12"/><circle cx="74" cy="680" r="295" fill="#16476b" opacity=".17"/>
  <g opacity=".14" stroke="#91cbe5"><path d="M0 115h1200M0 215h1200M0 315h1200M0 415h1200M0 515h1200M0 615h1200"/><path d="M100 0v675M250 0v675M400 0v675M550 0v675M700 0v675M850 0v675M1000 0v675M1150 0v675"/></g>
  <g transform="translate(75 63)"><circle cx="41" cy="41" r="26" fill="#ffb84f" opacity=".25" filter="url(#glow)"/><circle cx="41" cy="41" r="22" fill="url(#amber)"/><path d="M41 7V0M41 82v-7M7 41H0M82 41h-7M17 17l-5-5M70 70l-5-5M65 17l5-5M17 65l-5 5" stroke="#ffd276" stroke-width="4" stroke-linecap="round"/><text x="86" y="37" fill="#f8fbff" font-family="Inter,system-ui,sans-serif" font-size="37" font-weight="760" letter-spacing="5">SOL</text><text x="88" y="65" fill="#a4c8dc" font-family="Inter,system-ui,sans-serif" font-size="14" letter-spacing="2.7">MINIMUM AUTHORITY</text></g>
  <text x="600" y="190" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="50" font-weight="770" text-anchor="middle" letter-spacing="2.5">PERMISSIONS ARE NOT PROMPTS</text>
  <g transform="translate(67 285)" font-family="Inter,system-ui,sans-serif"><rect width="250" height="175" rx="22" fill="url(#glass)" stroke="#8ec9e6" stroke-opacity=".62" stroke-width="2"/><circle cx="125" cy="57" r="24" fill="#88c5e4" opacity=".2"/><circle cx="125" cy="52" r="9" fill="#cceeff"/><path d="M107 76c4-13 32-13 36 0" stroke="#cceeff" stroke-width="7" stroke-linecap="round"/><text x="125" y="116" fill="#f6fbff" font-size="20" font-weight="720" text-anchor="middle">APP IDENTITY</text><text x="125" y="145" fill="#9fc4d8" font-size="14" text-anchor="middle">Publisher lineage</text></g>
  <g transform="translate(366 285)" font-family="Inter,system-ui,sans-serif"><rect width="250" height="175" rx="22" fill="url(#glass)" stroke="#8ec9e6" stroke-opacity=".62" stroke-width="2"/><path d="M82 44h86v54H82z" fill="#81beda" opacity=".16" stroke="#c3e9fa" stroke-width="3"/><path d="m99 70 13 13 27-30" fill="none" stroke="#cceeff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="116" fill="#f6fbff" font-size="20" font-weight="720" text-anchor="middle">TYPED REQUEST</text><text x="125" y="145" fill="#9fc4d8" font-size="14" text-anchor="middle">No raw command path</text></g>
  <g transform="translate(665 257)" font-family="Inter,system-ui,sans-serif"><rect width="250" height="231" rx="24" fill="url(#glass)" stroke="#ffbd59" stroke-width="2.5"/><path d="M125 32 165 48v31c0 28-18 45-40 58-22-13-40-30-40-58V48z" fill="#ffbd59" opacity=".15" stroke="#ffcb73" stroke-width="3"/><path d="M108 80h34M125 63v34" stroke="#ffd17d" stroke-width="6" stroke-linecap="round"/><text x="125" y="159" fill="#f6fbff" font-size="20" font-weight="730" text-anchor="middle">GRANT ATOM</text><text x="125" y="184" fill="#e8bc70" font-size="13" text-anchor="middle">User · App · Capability</text><text x="125" y="205" fill="#e8bc70" font-size="13" text-anchor="middle">Resource · Duration</text></g>
  <g transform="translate(964 285)" font-family="Inter,system-ui,sans-serif"><rect width="169" height="175" rx="22" fill="url(#glass)" stroke="#8ec9e6" stroke-opacity=".62" stroke-width="2"/><circle cx="67" cy="65" r="10" fill="#ffcc72"/><path d="M77 65h47M112 65v17M98 65v12" stroke="#ffcc72" stroke-width="6" stroke-linecap="round"/><text x="84" y="116" fill="#f6fbff" font-size="18" font-weight="720" text-anchor="middle">HANDLE</text><text x="84" y="143" fill="#9fc4d8" font-size="13" text-anchor="middle">Scoped · Revocable</text></g>
  <path d="M330 373h19" stroke="#ffbd59" stroke-width="4" marker-end="url(#arrow)"/><path d="M629 373h19" stroke="#ffbd59" stroke-width="4" marker-end="url(#arrow)"/><path d="M928 373h19" stroke="#ffbd59" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(244 545)" font-family="Inter,system-ui,sans-serif"><rect width="712" height="72" rx="18" fill="#06121e" fill-opacity=".78" stroke="#5f9dc3" stroke-opacity=".42"/><text x="356" y="31" fill="#fff" font-size="17" font-weight="680" text-anchor="middle" letter-spacing="1.4">GRANT + AUDIT + HANDLE</text><text x="356" y="54" fill="#ffbd59" font-size="14" font-weight="720" text-anchor="middle" letter-spacing="2.8">COMMIT TOGETHER OR NOT AT ALL</text></g>
</svg>
